name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, "1.88"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # The compile-fail snapshots are pinned to stable's wording.
      - run: cargo test --workspace
        if: matrix.toolchain == 'stable'
      - run: cargo test --workspace -- --skip compile_fail
        if: matrix.toolchain != 'stable'

  expand:
    name: expansion snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - run: cargo test --test expand -- --ignored

  conformance:
    name: conformance matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      # The matrix builds some hundred and ten crates from cold; the
      # runner's own toolsets this job does not use make room for them.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # A failure is a cell that diverged from the model, a line of
      # `known.tsv` that excuses nothing any more, or a census that moved.
      # A cold run keeps no incremental cache, which only fills the disk.
      - run: cargo run -p whichever-conformance --release -- run --shape
        env:
          CARGO_INCREMENTAL: 0
      - run: df -h /
        if: always()

  no_std:
    name: no_std target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo check -p smoke-no-std --target thumbv7em-none-eabi

  mixed:
    name: mixed whichever versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The trait's crate on this checkout, the enum's on the last published
      # version: the older reader has to report the newer carrier in one
      # sentence, not misread it.
      - run: python3 smoke/mixed/check.py

  benchmarks:
    name: benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench -p whichever-benchmarks --no-run
      # Compiles the probe to assembly and compares every subject with the
      # hand-written match; exercises the script's x86-64 path.
      - run: python3 benchmarks/scripts/codegen.py

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Without the default feature the macro crate's tree is
      # `proc-macro2`, `quote` and `syn` alone.
      - run: cargo check -p whichever --no-default-features --tests
      - run: cargo doc --no-deps -p whichever -p whichever-macros
        env:
          RUSTDOCFLAGS: -D warnings
      # Every number the README and the guide quote is one RESULTS.md holds.
      - run: python3 benchmarks/scripts/check_numbers.py
      # Every relative link in the Markdown docs reaches a file and a heading.
      - run: python3 scripts/check_links.py

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Against the last published version, so a release entry's list of
      # breaks can be seen to be whole.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: whichever
