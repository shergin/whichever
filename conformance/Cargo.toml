[package]
name = "whichever-conformance"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "The conformance matrix of whichever: cells generated from a model of the supported features, each checked against the hand-written forwarding"

[dependencies]
# The shape check reads expansions; the versions are the macro crate's.
proc-macro2 = "1"
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
# Cargo's diagnostics arrive as JSON.
serde_json = "1"
