# A dependency graph with two versions of `whichever`: the trait's crate on
# this checkout, the enum's crate on the minor before it. Cargo allows it,
# since two minors of a 0.x crate are two majors to it, and the older reader
# has to give an honest result, reading the carrier or saying in one
# sentence that it is newer; `check.py` asserts that it does. A workspace of
# its own, since its `whichever` is not the root's.
[workspace]
resolver = "2"
members = ["traits", "enums"]
