[package]
name = "whichever"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Implements a trait for an enum by forwarding to whichever variant it holds"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shergin/whichever"
keywords = ["enum", "dispatch", "delegation", "forwarding", "enum_dispatch"]
categories = ["rust-patterns"]
readme = "README.md"
exclude = ["/smoke", "/.github"]

[dependencies]
whichever-macros = { version = "0.1.0", path = "macros" }

[dev-dependencies]
macrotest = "1"
pollster = "0.4"
trybuild = "1"

[workspace]
members = ["macros", "smoke/engine", "smoke/ocean", "smoke/renamed", "smoke/no_std"]
