[package]
name = "whichever"
version = "0.7.3"
edition = "2021"
rust-version = "1.88"
description = "Implements a trait for an enum by forwarding to whichever variant it holds"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shergin/whichever"
documentation = "https://docs.rs/whichever"
keywords = ["enum", "dispatch", "delegation", "forwarding", "enum_dispatch"]
categories = ["rust-patterns"]
readme = "README.md"
exclude = ["/smoke", "/benchmarks", "/conformance", "/docs", "/.github", "/rust-toolchain.toml", "/notes", "/CLAUDE.md"]

[features]
default = ["renamed-dependency"]
# A crate that renames its `whichever` dependency needs this; without it
# the macro crate's dependency tree is `proc-macro2`, `quote` and `syn`.
renamed-dependency = ["whichever-macros/renamed-dependency"]

[dependencies]
# Pinned exactly: the facade's `__private` module and the macros' generated
# code are one interface, and the two crates are released together.
whichever-macros = { version = "=0.7.3", path = "macros" }

[dev-dependencies]
async-trait = "0.1"
macrotest = "1"
pollster = "0.4"
trybuild = "1"

[workspace]
members = [
    "macros",
    "smoke/traits",
    "smoke/enums",
    "smoke/renamed",
    "smoke/no_std",
    "benchmarks",
    "benchmarks/subjects",
    "conformance",
]
# A workspace of its own: its enum crate uses the last published
# `whichever`, which this workspace's members must not.
exclude = ["smoke/mixed"]

# The benchmarks run under the default `bench` profile, where each crate is
# optimised on its own; this profile shows what link-time optimisation
# changes: `cargo bench -p whichever-benchmarks --profile bench-lto`.
[profile.bench-lto]
inherits = "bench"
lto = "fat"
codegen-units = 1
