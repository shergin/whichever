[package]
name = "whichever"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Implements a trait for an enum by forwarding to whichever variant it holds"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shergin/whichever"
documentation = "https://docs.rs/whichever"
keywords = ["enum", "dispatch", "delegation", "forwarding", "enum_dispatch"]
categories = ["rust-patterns"]
readme = "README.md"
exclude = ["/smoke", "/benchmarks", "/docs", "/.github", "/rust-toolchain.toml"]

[dependencies]
whichever-macros = { version = "0.3.0", path = "macros" }

[dev-dependencies]
macrotest = "1"
pollster = "0.4"
trybuild = "1"

[workspace]
members = [
    "macros",
    "smoke/traits",
    "smoke/enums",
    "smoke/renamed",
    "smoke/no_std",
    "benchmarks",
    "benchmarks/subjects",
]

# The benchmarks run under the default `bench` profile, where each crate is
# optimised on its own; this profile shows what link-time optimisation
# changes: `cargo bench -p whichever-benchmarks --profile bench-lto`.
[profile.bench-lto]
inherits = "bench"
lto = "fat"
codegen-units = 1
