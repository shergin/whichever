[package]
name = "whichever-macros"
version = "0.5.2"
edition = "2021"
rust-version = "1.88"
description = "Procedural macros of the whichever crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shergin/whichever"
readme = "README.md"
# The design record is for the repository, not the package.
exclude = ["ARCHITECTURE.md"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
