[package]
name = "whichever-macros"
version = "0.7.1"
edition = "2021"
rust-version = "1.88"
description = "Procedural macros of the whichever crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shergin/whichever"
readme = "README.md"
# The design record is for the repository, not the package.
exclude = ["ARCHITECTURE.md"]

[lib]
proc-macro = true

[features]
# Looks the facade's name up through `proc-macro-crate`, so that a crate
# which renames its `whichever` dependency still works; off, the facade is
# `whichever` and the tree is `proc-macro2`, `quote` and `syn` alone.
renamed-dependency = ["dep:proc-macro-crate"]

[dependencies]
proc-macro-crate = { version = "3", optional = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
